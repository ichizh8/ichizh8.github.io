<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="chizh.us">
  <title>chizh.us</title>
  <!-- Two marks of equal weight, displaced: an equals sign that has been pushed
       out of register. One is ink, one is signal. Nothing is copied from any
       existing identity. -->
